name: miruryoiki
description: "Flutter desktop application designed to track and manage local media files."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.4.26+0

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  fluent_ui: ^4.11.5
  provider: ^6.0.3
  win32: ^5.12.0
  path: ^1.8.2
  file_picker: ^10.1.2
  window_size: ^0.1.0
  path_provider: ^2.1.5
  open_app_file: ^4.0.2
  flutter_dotenv: ^5.2.1
  graphql: ^5.2.1
  oauth2: ^2.0.3
  flutter_secure_storage: ^9.2.4
  http: ^1.3.0
  url_launcher: ^6.3.1
  # Pinned to the 1.x line: silky_scroll 2.x requires Dart SDK >=3.10.7, which
  # Flutter 3.32.8 (Dart 3.8) does not ship. Revisit when Flutter is upgraded.
  silky_scroll: ^1.0.16
  app_links: ^6.4.0
  flutter_acrylic: ^1.1.4
  system_theme: ^3.1.2
  window_manager: ^0.5.1
  open_file: ^3.5.10
  recase: ^4.1.0
  palette_generator: ^0.3.3+3
  google_fonts: ^6.2.1
  jovial_svg: ^1.1.25
  bitsdojo_window: ^0.1.6
  toggle_switch: ^2.3.0
  crypto: ^3.0.6
  win32_registry: ^2.1.0
  transparent_image: ^2.0.1
  defer_pointer: ^0.0.2
  collection: ^1.19.1
  ffi: ^2.1.4
  logger: ^2.5.0
  synchronized: ^3.3.0+3
  material_symbols_icons: ^4.2815.0
  flutter_custom_cursor: ^0.0.4
  intl: ^0.20.2
  image: ^4.0.0
  video_data_utils:
    git:
      url: https://github.com/LordLux/video_data_utils.git
      ref: 938b7b3e5cb4a759c2001daea7bdb7a290cd1d4f
  flutter_desktop_context_menu:
    git:
      url: https://github.com/LordLux/flutter_desktop_context_menu.git
      ref: 6d953f2d474af123978fb2159f6c1c972669e92d
  cached_network_image: ^3.3.1
  animated_flip_counter: ^0.3.4
  pie_chart: ^5.4.0
  fl_chart: ^0.69.0
  flexible_wrap: ^1.0.6
  flutter_html: ^3.0.0
  connectivity_plus: ^6.0.5
  flutter_html_iframe: ^3.0.0
  webview_windows: ^0.4.0
  flutter_html_video: ^3.0.0
  flutter_heatmap_calendar: ^1.0.5
  package_info_plus: ^8.3.0
  args: ^2.7.0
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.18
  md5_file_checksum: ^1.1.0
  json_annotation: ^4.9.0
  scrollable_positioned_list: ^0.3.8
  flutter_single_instance: ^1.6.0 # TODO https://pub.dev/packages/flutter_single_instance#macos
  shimmer: ^3.0.0
  sticky_headers:
    git:
      url: https://github.com/LordLux/flutter_expandable_sticky_headers.git
      ref: 50847dd935a2ab66b81e7613fd6a7c0249e234e6
  squiggly_slider:
    git:
      url: https://github.com/LordLux/squiggly_slider.git
      ref: 6668955aa13eac2a6280e5acdaf3a98f7d9b6735
  flutter_svg: ^2.2.1
  process_monitor:
    git:
      url: https://github.com/LordLux/process_monitor.git
      ref: 0a48ecab0d5752a0991300f9934ec1be6e9485d5
  glossy: ^0.0.5
  flutter_anitomy:
    git:
      url: https://github.com/LordLux/flutter_anitomy.git
      ref: ef5a47ec614f453f6b5c7d45777194e18d50f82f
  visibility_detector: ^0.4.0+2
  tray_manager: ^0.5.2
  marquee:
    git:
      url: https://github.com/LordLux/marquee.git
      ref: 1dcafefd97c83c513064783bd2db2138422241c4
  shared_preferences: ^2.5.3
  material_shapes:
    git:
      https://github.com/ksokolovskyi/material_shapes.git
  flutter_animated_fluent_emoji:
    git:
      url: https://github.com/LordLux/flutter_animated_fluent_emoji.git
      ref: c7abd70a32f1017b63d3e749da6a0837c2f83671
