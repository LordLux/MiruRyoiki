dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.14.0
  json_serializable: ^6.7.1
  mockito: ^5.4.4
  build_runner: ^2.4.7
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3
  graphql_codegen: ^1.2.4
  plugin_platform_interface: ^2.1.8

# NOTE: local development overrides live in `pubspec_overrides.yaml` (gitignored),
# not here — an absolute `path:` committed in this file breaks `pub get` on every
# other machine. See `pubspec_overrides.yaml.example` and the README.

linter:
  rules:
    - prefer_relative_imports

flutter:
  uses-material-design: true

  assets:
    - .env
    
  ### Anilist:
    - assets/icons/anilist/logo.png
    - assets/icons/anilist/logo.si
    - assets/icons/anilist/offline.si
    - assets/icons/anilist/offline_logo.si

    # Faces:
    - assets/icons/
    - assets/icons/faces/
    
  ### System Icons:
    - assets/system/icon.ico
    - assets/system/icon32.ico
    - assets/system/icon48.ico
    - assets/system/icon64.ico
    - assets/system/icon156.ico
    - assets/system/icon.png
    
    # Cursors:
    - assets/system/cursors/grab.png
    - assets/system/cursors/grabbing.png
    
    # Context Menu:
    - assets/system/context/anilist.png
    - assets/system/context/check.png
    - assets/system/context/check_all.png
    - assets/system/context/check_previous.png
    - assets/system/context/copy.ico
    - assets/system/context/folder_info.ico
    - assets/system/context/folder_open.ico
    - assets/system/context/hide.ico
    - assets/system/context/list.png
    - assets/system/context/play.png
    - assets/system/context/remove_link.png
    - assets/system/context/series.ico
    - assets/system/context/unhide.ico
    - assets/system/context/unwatch.ico
    - assets/system/context/video_info.ico
    - assets/system/context/watch.png
    - assets/system/context/watch_all.ico
    
    # Video Players:
    - assets/system/players/
    - assets/system/players/vlc.si
    - assets/system/players/mpchc.si
    
    # Software:
    - assets/system/software/
    - assets/system/software/sonarr.si
    - assets/system/software/qbittorrent.si
    
  ### Images:
    - assets/images/noise.png

  ### Fonts:
  fonts:
    - family: StackSansNotch
      fonts:
        - asset: assets/fonts/StackSansNotch-Regular.ttf

flutter_launcher_icons:
  image_path: "assets/system/icon.png"
  windows:
    generate: true
    image_path: "assets/system/icon.png"
    icon_size: 128 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/system/icon.png"