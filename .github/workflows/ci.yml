name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install pinned Flutter version via FVM
        run: fvm install

      - name: Create .env placeholder
        run: Copy-Item .env.example .env

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Analyze
        # No `shell: bash` here: fvm is only on PATH for the default runner shell
        # (pwsh on windows-latest). An earlier version of this step used bash so
        # it could grep for severity counts, and fvm silently resolved to nothing
        # there ("fvm: command not found"), which `|| true` swallowed — the step
        # then "analyzed" an empty file and reported 0 issues, passing every time
        # without ever running the analyzer. Mirrors build.ps1's PowerShell
        # counting logic instead, which is what's actually verified to work.
        run: |
          $analyzeOutput = fvm flutter analyze 2>&1
          $analyzeOutput | ForEach-Object { Write-Host $_ }

          $errorCount = ($analyzeOutput | Select-String -Pattern '^\s*error - ').Count
          $warningCount = ($analyzeOutput | Select-String -Pattern '^\s*warning - ').Count
          $infoCount = ($analyzeOutput | Select-String -Pattern '^\s*info - ').Count

          Write-Host ""
          Write-Host "Analyze summary: $errorCount error(s), $warningCount warning(s), $infoCount info(s)"

          if ($errorCount -gt 0) {
            Write-Host "Failing: analyzer found real errors." -ForegroundColor Red
            exit 1
          }

          # flutter analyze's own exit code (in $LASTEXITCODE) is 1 whenever any
          # warning/info exists, which is exactly the case this step exists to
          # NOT fail on. Without this, the step would inherit that stale exit
          # code and fail regardless of $errorCount.
          Write-Host "No errors — warnings/infos are tracked but non-blocking."
          exit 0

      - name: Run offline test suite
        run: powershell -File test/launch_scripts/unit.ps1
