name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install FVM
        run: dart pub global activate fvm

      - name: Install pinned Flutter version via FVM
        run: fvm install

      - name: Create .env placeholder
        run: Copy-Item .env.example .env

      - name: Get dependencies
        run: fvm flutter pub get

      - name: Analyze
        shell: bash
        run: |
          fvm flutter analyze > analyze_output.txt 2>&1 || true
          cat analyze_output.txt

          error_count=$(grep -cE '^\s*error - ' analyze_output.txt || true)
          warning_count=$(grep -cE '^\s*warning - ' analyze_output.txt || true)
          info_count=$(grep -cE '^\s*info - ' analyze_output.txt || true)

          echo ""
          echo "Analyze summary: ${error_count} error(s), ${warning_count} warning(s), ${info_count} info(s)"

          if [ "$error_count" -gt 0 ]; then
            echo "Failing: analyzer found real errors."
            exit 1
          fi

          echo "No errors — warnings/infos are tracked but non-blocking."

      - name: Run offline test suite
        run: powershell -File test/launch_scripts/unit.ps1
