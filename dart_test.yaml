# Tags for selective test execution.
#
# real-api        - hit the real AniList API; need a valid ACCESS_TOKEN in test/.env.
#                   Run:  powershell -File test/launch_scripts/real_anilist.ps1
# requires-player - need a real running media player (VLC/MPC-HC, web interface on).
#                   Run:  powershell -File test/launch_scripts/requires_player.ps1
#
# Fast offline suite (excludes both):  powershell -File test/launch_scripts/unit.ps1
tags:
  real-api: {}
  requires-player: {}
